# Release — tag-triggered, GoReleaser, notes from the CHANGELOG.
#
# croft is a Go library: there are no binaries to build, so the release
# object carries exactly two things — the tag (which is what pkg.go.dev
# serves) and release notes. The notes are NOT generated from commit
# subjects; CHANGELOG.md is the single source of truth, and the workflow
# extracts this tag's `## vX.Y.Z` section from it.
#
# The extraction refuses to publish a release without a CHANGELOG section:
# tagging with the section missing, or still titled Unreleased, fails the
# workflow before GoReleaser runs rather than shipping a release whose notes
# are someone's memory of what went out.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: release (goreleaser)
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          # Full history: GoReleaser resolves this tag and its predecessor,
          # which a shallow clone cannot serve.
          fetch-depth: 0

      - name: setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: extract release notes from CHANGELOG
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          case "$tag" in
            v*) ;;
            *) echo "refusing: tag $tag is not a v* tag" >&2; exit 1 ;;
          esac
          if [ ! -f CHANGELOG.md ]; then
            echo "refusing: CHANGELOG.md not found at the tagged commit" >&2
            exit 1
          fi
          # Notes and their scratch files go under $RUNNER_TEMP, never the
          # working tree: GoReleaser's dirty check counts untracked files,
          # and a notes file at the repo root fails the release it is meant
          # to serve (observed live: "?? release-notes.md" → errors/dirty).
          # Prefix match that requires the next character to be a boundary
          # (end of line, space, tab): "## v0.9.2 - 2026-01-01" matches the
          # v0.9.2 section, while "## v0.9.22" and "## v0.9.2-rc1" do not.
          # The scan exits on the next versioned OR Unreleased heading — the
          # two shapes any CHANGELOG section can have in this repo — so an
          # "## Unreleased" left in place below the new section (added above
          # instead of renamed) cannot leak into the notes. The guard is
          # deliberately narrower than "any ## heading": inners are checked,
          # not trusted — see below.
          awk -v tag="$tag" '
            BEGIN { heading = "## " tag }
            seen && /^## (v[0-9]|Unreleased)/ { exit }
            substr($0, 1, length(heading)) == heading {
              c = substr($0, length(heading) + 1, 1)
              if (c == "" || c == " " || c == "\t") { seen = 1; next }
            }
            seen { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          # Empty after stripping blank lines is a missing section, not a
          # one-line section; both are pre-merge authoring failures.
          if ! grep -q . "$RUNNER_TEMP/release-notes.md"; then
            echo "refusing: CHANGELOG.md has no ## $tag section (or it is empty) at this tag" >&2
            exit 1
          fi
          # No level-2 heading may survive inside the notes. One means either
          # an unknown section shape after this section (the scan above
          # deliberately terminates only on vX / Unreleased) or an inner
          # subheading of the notes themselves — both are CHANGELOG authoring
          # errors that would otherwise ship silently, as leaked content
          # or truncated scan. Refuse and name the line; the fix is renaming
          # the heading or demoting it to "###".
          if grep -n '^## ' "$RUNNER_TEMP/release-notes.md" > "$RUNNER_TEMP/release-notes-headings"; then
            echo "refusing: level-2 headings inside the ## $tag notes (renamed or demote them):" >&2
            cat "$RUNNER_TEMP/release-notes-headings" >&2
            exit 1
          fi
          echo "-- release notes for $tag --" >&2
          cat "$RUNNER_TEMP/release-notes.md" >&2

      - name: run goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          # Exact pin: the config was validated and snapshot-released against
          # this binary. A GoReleaser upgrade here is a deliberate act — bump
          # the pin and re-run the snapshot locally first.
          version: v2.12.7
          # The notes path is expanded by the runner's expression engine, not
          # by a shell: goreleaser-action splits args with exec semantics, so
          # "$RUNNER_TEMP/..." there stays the literal string — observed live
          # as a published release whose notes were empty, because GoReleaser
          # was handed a file at a path that does not exist. runner.temp and
          # the run: step's $RUNNER_TEMP are the same directory.
          args: release --clean --release-notes ${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The failure this guards against already happened once: goreleaser was
      # handed a nonexistent notes path and published the release anyway,
      # notes empty. That step must not fail soft twice. The check is loose
      # on purpose (GoReleaser appends its footer after the notes): the
      # shipped body contains the notes' first and last non-blank lines.
      - name: verify the notes reached the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
            --json body --jq .body > "$RUNNER_TEMP/shipped.md"
          first=$(grep -m1 . "$RUNNER_TEMP/release-notes.md")
          last=$(grep . "$RUNNER_TEMP/release-notes.md" | tail -1)
          grep -qF -- "$first" "$RUNNER_TEMP/shipped.md" || {
            echo "refusing: the published release body does not contain the notes' first line" >&2
            exit 1
          }
          grep -qF -- "$last" "$RUNNER_TEMP/shipped.md" || {
            echo "refusing: the published release body does not contain the notes' last line" >&2
            exit 1
          }
